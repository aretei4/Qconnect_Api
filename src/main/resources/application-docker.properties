server.port=8080

# ── Database — points at the postgres Docker service ──────────────────────────
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:distr_v01}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:Sachi@2010}

# ── JWT ────────────────────────────────────────────────────────────────────────
onlyoffice.jwt.secret=${JWT_SECRET:abq3EH95CcmsYqrz5voHdGJkxCRqm0fE}
app.jwt.expiration-ms=${JWT_EXPIRY_MS:86400000}

# ── Jackson ────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── File upload ────────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── AWS / SMS ── override via env vars in docker-compose ──────────────────────
aws.region=${AWS_REGION:ap-south-1}
aws.access-key=${AWS_ACCESS_KEY:change-me}
aws.secret-key=${AWS_SECRET_KEY:change-me}
sms.twofactor.api-key=${SMS_API_KEY:change-me}
sms.twofactor.sender-id=${SMS_SENDER_ID:SENDER}
sms.twofactor.template-name=${SMS_TEMPLATE:Delivery}
sms.twofactor.base-url=https://2factor.in/

# ── JWT signing — configurable algorithm ──────────────────────────────────────
# HS256 (default): symmetric, signs with onlyoffice.jwt.secret above
# RS256:           asymmetric, signs with the RSA private key, verifies with the public key
#   Generate keys: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
#                  openssl rsa -in jwt-private.pem -pubout -out jwt-public.pem
#app.jwt.algorithm=HS256
app.jwt.algorithm=RS256
app.jwt.private-key=classpath:keys/jwt-private.pem
app.jwt.public-key=classpath:keys/jwt-public.pem
app.jwt.expiration-ms=86400000

