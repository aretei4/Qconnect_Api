spring.profiles.active=uat
# Ensure NoHandlerFoundException reaches @ExceptionHandler instead of default 404 page
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
# ── JWT enforcement (applies to all profiles; override per profile if needed) ──
# true  = every endpoint requires a valid JWT (mobile-agent endpoints stay whitelisted)
# false = legacy: only /api/users/** protected
app.security.enforce=false
