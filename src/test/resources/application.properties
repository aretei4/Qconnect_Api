# ── In-memory H2 datasource (replaces remote PostgreSQL during tests) ──────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Initialise schema from src/test/resources/schema.sql on startup
spring.sql.init.mode=always

# ── JWT (same secret, short expiry for tests) ──────────────────────────────────
onlyoffice.jwt.secret=abq3EH95CcmsYqrz5voHdGJkxCRqm0fE
app.jwt.expiration-ms=3600000

# ── Disable multipart ─────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=false

# ── Stub out AWS / SMS so beans that read these don't fail ────────────────────
aws.region=us-east-1
aws.access-key=test-key
aws.secret-key=test-secret
sms.twofactor.api-key=test
sms.twofactor.sender-id=TEST
sms.twofactor.template-name=Test
sms.twofactor.base-url=http://localhost/
