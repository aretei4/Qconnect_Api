server {
    listen 80;
    server_name onlyoffice-dev.qualcy.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name onlyoffice-dev.qualcy.net;

    ssl_certificate /etc/letsencrypt/live/onlyoffice-dev.qualcy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onlyoffice-dev.qualcy.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://onlyoffice-document-server:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
