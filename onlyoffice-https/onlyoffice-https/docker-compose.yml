version: '3'

services:
  onlyoffice-document-server:
    image: onlyoffice/documentserver
    container_name: onlyoffice-document-server
    restart: always
    expose:
      - "80"
    environment:
      - JWT_SECRET=abq3EH95CcmsYqrz5voHdGJkxCRqm0fE
      - JWT_HEADER=Authorization
      - JWT_ENABLED=true
      - ENABLE_WEBSOCKETS=false

  nginx:
    image: nginx:alpine
    container_name: onlyoffice-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/onlyoffice.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    container_name: onlyoffice-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "sleep 10 && 
      certbot certonly --webroot --webroot-path=/var/www/certbot 
      --agree-tos --no-eff-email 
      --email s_rout@qualcysystem.com
      -d onlyoffice-dev.qualcy.net"