<VirtualHost *:80>
    ServerName yourdomain.com

    ProxyPreserveHost On

    # Forward /app1 to Tomcat
    ProxyPass "/onlyoffice" "http://15.207.0.96/"
    ProxyPassReverse "/onlyoffice" "http://15.207.0.96/"

     # === Forward everything else ===
    ProxyPass "/" "http://localhost:8080/"
    ProxyPassReverse "/" "http://localhost:8080/"

    # Forward /node to Node.js app on different server
    ProxyPass "/node" "http://10.0.0.5:3000/"
    ProxyPassReverse "/node" "http://10.0.0.5:3000/"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>